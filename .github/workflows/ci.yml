name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            retouch-travel-portrait/requirements.txt
            requirements-validation.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r retouch-travel-portrait/requirements.txt \
            -r requirements-validation.txt
          python -m pip check

      - name: Validate repository and Skill structure
        run: python scripts/validate_repo.py .

      - name: Run unit tests
        run: >-
          python -m unittest discover
          -s retouch-travel-portrait/tests
          -p "test_*.py"
          -v

  package:
    name: Build and retest release archive
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RELEASE_ROOT: retouch-travel-portrait-v0.7.0-beta
      ARCHIVE_PATH: dist/retouch-travel-portrait-v0.7.0-beta.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            retouch-travel-portrait/requirements.txt
            requirements-validation.txt

      - name: Install validation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Build archive from tracked release files
        run: |
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="${RELEASE_ROOT}/" \
            --output="${ARCHIVE_PATH}" \
            HEAD

      - name: Inspect archive contents
        run: python scripts/validate_repo.py . --archive "${ARCHIVE_PATH}"

      - name: Extract exact archive
        run: python -m zipfile -e "${ARCHIVE_PATH}" dist/unpacked

      - name: Install extracted runtime dependencies
        run: |
          python -m pip install \
            -r "dist/unpacked/${RELEASE_ROOT}/retouch-travel-portrait/requirements.txt" \
            -r "dist/unpacked/${RELEASE_ROOT}/requirements-validation.txt"
          python -m pip check

      - name: Validate extracted repository
        run: >-
          python
          "dist/unpacked/${RELEASE_ROOT}/scripts/validate_repo.py"
          "dist/unpacked/${RELEASE_ROOT}"

      - name: Retest extracted Skill
        run: >-
          python -m unittest discover
          -s "dist/unpacked/${RELEASE_ROOT}/retouch-travel-portrait/tests"
          -p "test_*.py"
          -v
